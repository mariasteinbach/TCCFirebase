<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empréstimo de Livros - Livraria</title>
  <link rel="stylesheet" href="css/style.css">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
    crossorigin="anonymous">
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm p-4">
          <h1 class="h3 mb-4 text-center">Registro de Empréstimo</h1>

          <form id="contactForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="titulo" class="form-label">Título do Livro:</label>
                <input
                  type="text"
                  id="titulo"
                  name="titulo"
                  class="form-control"
                  placeholder="Ex: Dom Casmurro"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label for="autor" class="form-label">Nome do Autor:</label>
                <input
                  type="text"
                  id="autor"
                  name="autor"
                  class="form-control"
                  placeholder="Ex: Machado de Assis"
                  required
                />
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="dataEmprestimo" class="form-label">Data de Empréstimo:</label>
                <input
                  type="date"
                  id="dataEmprestimo"
                  name="dataEmprestimo"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label for="formato" class="form-label">Formato:</label>
                <select id="formato" name="formato" class="form-select" required>
                  <option value="" disabled selected>Selecione o formato</option>
                  <option value="PDF">PDF</option>
                  <option value="EPUB">EPUB</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nomeLeitor" class="form-label">Nome do Leitor:</label>
                <input
                  type="text"
                  id="nomeLeitor"
                  name="nomeLeitor"
                  class="form-control"
                  placeholder="Quem pegou o livro"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label for="telefoneLeitor" class="form-label">Telefone do Leitor:</label>
                <input
                  type="tel"
                  id="telefoneLeitor"
                  name="telefoneLeitor"
                  class="form-control"
                  placeholder="(00) 00000-0000"
                  required
                />
              </div>
            </div>
            
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary mb-2">
                Registrar Empréstimo
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="row justify-content-center mt-5 mb-5">
      <div class="col-md-11">
        <div class="card shadow-sm p-4">
          <h2 class="h4 mb-4 text-center">Empréstimos Registrados</h2>

          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Título</th>
                  <th>Autor</th>
                  <th>Data Empréstimo</th>
                  <th>Formato</th>
                  <th>Leitor</th>
                  <th>Telefone</th>
                </tr>
              </thead>
              <tbody id="tabelaProdutos">
                <tr>
                  <td colspan="6" class="text-center text-muted">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/enviarDados.js"></script>
  <script type="module" src="js/lerDados.js"></script>
</body>
</html>
